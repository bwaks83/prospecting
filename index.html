<style>
:root{--bg:#080807;--panel:#10100e;--panel2:#151410;--ink:#f6f2e9;--muted:#a9a497;--gold:#d7b46a;--gold2:#f1d48a;--line:rgba(215,180,106,.36);--soft:rgba(215,180,106,.09);--serif:Georgia,'Times New Roman',serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box}html{background:var(--bg);color:var(--ink);scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -16%,rgba(166,119,42,.15),transparent 42%),var(--bg);font-family:var(--sans);font-size:14px}
.shell{width:min(1680px,100%);margin:0 auto;padding:24px 30px 56px}.dashboard-header{text-align:center;padding:18px 0 25px}.dashboard-header h1{font:clamp(34px,4.4vw,62px)/1.05 var(--serif);font-weight:400;letter-spacing:-.035em;margin:0;color:var(--ink)}.brand{display:flex;align-items:center;gap:13px;color:var(--gold2);text-transform:uppercase;letter-spacing:.22em;font-size:11px;font-weight:600}.brandmark{width:42px;height:42px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:17px;letter-spacing:0;color:var(--gold2);box-shadow:0 0 24px rgba(215,180,106,.1)}.brand small{display:block;color:var(--muted);letter-spacing:.28em;font-size:9px;margin-top:5px}.headline{text-align:center}.headline h1{font:clamp(32px,4.1vw,59px)/1 var(--serif);font-weight:400;letter-spacing:-.035em;margin:0}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.46em;text-transform:uppercase;margin-top:14px}.top-actions{display:flex;justify-content:flex-end;gap:12px;align-items:center}.searchbox{height:48px;max-width:320px;display:flex;align-items:center;gap:10px;padding:0 15px;border:1px solid rgba(238,229,208,.34);border-radius:28px;background:rgba(255,255,255,.02);flex:1}.searchbox svg{width:17px;color:var(--muted);flex:none}.searchbox input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:13px var(--sans)}.searchbox input::placeholder{color:#888477}.avatar{width:44px;height:44px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font:18px var(--serif)}
.intro{margin:17px 0 22px;text-align:center;color:#c9c3b6;font:15px/1.6 var(--serif)}.intro strong{color:var(--gold2);font-weight:400}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:linear-gradient(110deg,rgba(255,255,255,.025),rgba(215,180,106,.035));margin:0 0 18px}.metric{padding:14px 20px;display:flex;align-items:center;justify-content:center;gap:12px;min-height:67px}.metric+.metric{border-left:1px solid var(--line)}.metric-num{font:27px/1 var(--serif);color:var(--gold2)}.metric-label{color:var(--muted);font-size:10px;letter-spacing:.17em;text-transform:uppercase}.benchmarks{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:0 0 25px}.benchmark{padding:8px 13px;border:1px solid rgba(215,180,106,.21);border-radius:99px;color:#d8d1c2;font-size:11px;background:rgba(255,255,255,.018)}.benchmark b{color:var(--gold2);font-weight:500}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 17px;flex-wrap:wrap}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{appearance:none;border:1px solid rgba(215,180,106,.27);border-radius:99px;background:transparent;color:#c8c1b3;padding:8px 14px;font:11px var(--sans);letter-spacing:.04em;cursor:pointer;transition:.18s}.filter:hover,.filter.active{color:var(--bg);border-color:var(--gold);background:var(--gold)}.result-count{color:var(--muted);font-size:11px;white-space:nowrap}.result-count strong{color:var(--gold2);font-weight:500}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}.card{min-width:0;overflow:hidden;border:1px solid rgba(215,180,106,.64);border-radius:11px;background:linear-gradient(152deg,rgba(255,255,255,.025),transparent 42%),var(--panel);box-shadow:0 7px 24px rgba(0,0,0,.24);transition:transform .2s,border-color .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);border-color:var(--gold2);box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 22px rgba(215,180,106,.07)}.art-label{position:absolute;left:15px;top:14px;color:var(--gold2);font-size:9px;text-transform:uppercase;letter-spacing:.22em}.status{position:absolute;left:14px;bottom:13px;display:inline-flex;align-items:center;gap:7px;color:#eee8db;font-size:10px;letter-spacing:.09em;text-transform:uppercase}.dot{width:6px;height:6px;border-radius:50%;background:var(--gold2);box-shadow:0 0 8px var(--gold)}.status.pending .dot{background:#8f8a7d;box-shadow:none}.card-body{padding:18px 16px 15px}.card h2{font:24px/1.08 var(--serif);font-weight:400;letter-spacing:-.02em;margin:0 0 7px;min-height:34px;display:flex;align-items:flex-start}.segment{text-transform:uppercase;letter-spacing:.2em;color:#bcb5a7;font-size:9px;line-height:1.5;min-height:29px}.rule{height:1px;background:linear-gradient(90deg,var(--gold),rgba(215,180,106,.18));margin:11px 0 9px}.detail-row{display:grid;grid-template-columns:19px 1fr auto;align-items:center;gap:9px;min-height:31px;color:#dbd6cb;font-size:11px}.detail-row svg{width:17px;height:17px;stroke:var(--gold);fill:none;stroke-width:1.6}.detail-row .value{font:15px var(--serif);color:var(--gold2);text-align:right;max-width:57%;line-height:1.25}.card-foot{display:flex;justify-content:flex-end;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid rgba(215,180,106,.18)}.open-details{width:31px;height:31px;border:1px solid var(--gold);border-radius:50%;background:transparent;color:var(--gold2);font:22px/1 var(--serif);cursor:pointer;display:grid;place-items:center;transition:.15s}.open-details:hover{background:var(--gold);color:#0a0907}.empty{grid-column:1/-1;padding:56px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font:18px var(--serif)}footer{padding:26px 4px 0;text-align:center;color:#716c60;font-size:10px;letter-spacing:.05em}.modal{width:min(620px,calc(100% - 30px));padding:0;border:1px solid var(--gold);border-radius:14px;background:#11100d;color:var(--ink);box-shadow:0 26px 80px #000}.modal::backdrop{background:rgba(0,0,0,.78);backdrop-filter:blur(5px)}.modal-inner{padding:27px}.modal-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.modal h2{font:34px/1.1 var(--serif);font-weight:400;margin:0 0 7px}.modal .segment{min-height:0}.close{border:1px solid var(--line);background:transparent;color:var(--gold2);border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}.modal-rule{height:1px;background:var(--line);margin:19px 0}.modal-label{color:var(--gold);text-transform:uppercase;letter-spacing:.19em;font-size:10px;margin:15px 0 6px}.modal p{color:#d0cabd;line-height:1.65;margin:0;font-size:13px}.source-link{display:inline-block;margin-top:17px;color:var(--gold2);text-underline-offset:4px;font-size:12px}.source-link:hover{color:#fff}
@media(max-width:1180px){.shell{padding-inline:22px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.topbar{grid-template-columns:1fr 1.6fr 1fr}.card h2{font-size:22px}}
@media(max-width:850px){.topbar{grid-template-columns:1fr auto;gap:15px}.headline{grid-column:1/-1;grid-row:1;text-align:left}.brand{grid-column:1;grid-row:2}.top-actions{grid-column:2;grid-row:2}.headline h1{font-size:43px}.eyebrow{margin-top:8px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.intro{text-align:left}}
@media(max-width:560px){.shell{padding:16px 14px 40px}.dashboard-header{padding:13px 0 20px}.searchbox{max-width:100%;height:40px;padding:0 11px}.toolbar{align-items:flex-start;flex-direction:column}.filters{width:100%}.filter{padding:8px 11px}.result-count{align-self:flex-end}.toolbar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr;gap:12px}.card h2{min-height:0;font-size:25px}.segment{min-height:0;margin-bottom:8px}.card-body{padding:14px 15px}.result-count{align-self:flex-end}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

:root{--serif:'Montserrat',sans-serif;--sans:'Montserrat',sans-serif}
body{font-family:'Montserrat',sans-serif}
.dashboard-header h1{font-family:'Montserrat',sans-serif;font-weight:600}
.card-body{padding:20px 17px 18px}
.card h2{font-family:'Montserrat',sans-serif;font-size:32.4px;font-weight:700;line-height:1.15;letter-spacing:-.035em;text-align:left;min-height:0;display:block;margin:0 0 9px}
.prospect-title{color:var(--ink);text-decoration:underline;text-decoration-color:rgba(241,212,138,.72);text-decoration-thickness:1px;text-underline-offset:5px;cursor:pointer}
.prospect-title:hover{color:var(--gold2);text-decoration-color:var(--gold2)}
.segment{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:400;letter-spacing:.18em;text-align:left;min-height:0;margin:0 0 13px}
.rule{margin:0 0 8px}
.detail-row{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:center;justify-items:start;gap:10px;min-height:35px;text-align:left;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:300}
.detail-row .value{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:400;text-align:left;justify-self:start;max-width:100%;line-height:1.35;color:var(--gold2)}
.card-foot{display:none}
@media(max-width:1180px){.card h2{font-size:32.4px}}
@media(max-width:560px){.card h2{font-size:32.4px}}
.conversation-dot{display:inline-block;width:11px;height:11px;margin-left:10px;border-radius:50%;background:#39d779;vertical-align:middle;box-shadow:0 0 0 3px rgba(57,215,121,.12)}
.grid{align-items:start}
button.prospect-title{appearance:none;background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-align:left;line-height:inherit}
.prospect-title:focus-visible{outline:2px solid var(--gold2);outline-offset:5px;border-radius:2px}
html.details-open{overflow:hidden}
.prospect-dialog{width:min(1620px,calc(100% - 60px));max-width:none;max-height:calc(100dvh - 64px);padding:0;border:1px solid var(--gold);border-radius:18px;background:var(--panel);color:var(--ink);box-shadow:0 32px 100px #000;overflow:auto;font-family:var(--sans)}
.prospect-dialog::backdrop{background:rgba(0,0,0,.76);backdrop-filter:blur(6px)}
.prospect-dialog-inner{padding:44px 48px 56px;min-height:min(640px,calc(100dvh - 66px))}
.prospect-dialog-header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:32px}
.prospect-dialog h2{font-size:clamp(30px,3.2vw,48px);line-height:1.15;font-weight:700;letter-spacing:-.035em;margin:10px 0 0;overflow-wrap:anywhere}
.prospect-dialog .segment{font-size:11px;line-height:1.6;margin:0;color:var(--gold2)}
.dialog-close{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;color:var(--ink);background:transparent;font:300 30px/1 var(--sans);cursor:pointer}
.dialog-close:hover{color:var(--gold2);border-color:var(--gold2)}
.dialog-close:focus-visible{outline:2px solid var(--gold2);outline-offset:4px}
.dialog-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin:0;padding:28px 0;border-top:1px solid var(--line)}
.dialog-summary dt,.dialog-headquarters dt{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 10px}
.dialog-summary dd{font-size:20px;font-weight:400;line-height:1.5;margin:0;color:var(--ink);overflow-wrap:anywhere}
.dialog-headquarters{margin-top:24px}
.dialog-headquarters h3{font-size:22px;font-weight:600;margin:0 0 24px;color:var(--gold2)}
.dialog-headquarters dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:36px;margin:0}
.dialog-headquarters dd{font-size:24px;line-height:1.6;font-weight:400;margin:0;overflow-wrap:anywhere}
.hq-note{color:var(--muted);font-size:13px;line-height:1.7;margin:24px 0 0;max-width:900px}
.hq-source{display:inline-block;margin-top:14px;color:var(--gold2);font-size:13px;text-underline-offset:4px}
@media(max-width:850px){.prospect-dialog{width:calc(100% - 32px);max-height:calc(100dvh - 32px)}.prospect-dialog-inner{padding:28px;min-height:min(640px,calc(100dvh - 34px))}.dialog-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.dialog-headquarters dl{grid-template-columns:1fr;gap:24px}.dialog-headquarters dd{font-size:21px}}
@media(max-width:560px){.prospect-dialog-inner{padding:24px 20px 32px}.prospect-dialog-header{gap:12px}.dialog-summary{gap:22px 16px}.dialog-summary dd{font-size:17px}.dialog-summary dt,.dialog-headquarters dt{font-size:12px}.dialog-close{width:38px;height:38px}.dialog-headquarters dd{font-size:19px}}
.recipient-section{margin-top:38px;padding-top:30px;border-top:1px solid var(--line)}
.recipient-section h3{font-size:22px;font-weight:600;color:var(--gold2);margin:0 0 12px}
.recipient-intro{font-size:13px;line-height:1.7;color:var(--muted);max-width:1000px;margin:0 0 22px}
.recipient-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;list-style:none;padding:0;margin:0}
.recipient{padding:24px;border:1px solid var(--line);border-radius:12px;background:rgba(215,180,106,.025);min-width:0}
.recipient h4{font-size:21px;font-weight:600;margin:0 0 8px;color:var(--ink)}
.recipient-role{font-size:16px;line-height:1.5;color:var(--gold2);margin:0 0 15px}
.recipient-meta{font-size:12px;line-height:1.75;color:var(--muted);margin:10px 0}.recipient-meta strong{color:var(--ink);font-weight:500}
.recipient-status{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:11px;color:var(--gold2);line-height:1.5}
.recipient-links{display:flex;gap:18px;flex-wrap:wrap}.recipient-links a{font-size:12px;color:var(--gold2);text-underline-offset:4px}
@media(max-width:850px){.recipient-grid{grid-template-columns:1fr}.recipient{padding:20px}}
.dialog-website{display:inline-block;margin-top:14px;font-size:15px;font-weight:400;line-height:1.5;color:var(--gold2);text-underline-offset:4px;overflow-wrap:anywhere}.dialog-website:hover{color:var(--ink)}.dialog-website:focus-visible{outline:2px solid var(--gold2);outline-offset:4px}

/* Industry workspace: one shared layout, with self-contained industry data. */
:root{--sidebar-width:210px}
.industry-sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-width);padding:30px 15px;display:flex;flex-direction:column;background:#080807;border-right:1px solid var(--line);z-index:5;overflow:auto}
.workspace-brand{display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 0 42px;text-align:center;text-decoration:none;color:var(--gold2);font-size:12px;letter-spacing:.19em;font-weight:600}
.workspace-brand svg{width:52px;height:58px}.workspace-brand small{display:block;font-size:8px;font-weight:400;letter-spacing:.16em;color:var(--muted);margin-top:9px}
.nav-caption{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 14px 15px}
#industry-navigation{display:flex;flex-direction:column;gap:8px}
.industry-link{display:flex;align-items:center;gap:12px;padding:15px 12px;border:1px solid transparent;border-radius:8px;color:#d2cec4;text-decoration:none;font-size:12px;line-height:1.5;transition:background .18s,border-color .18s}
.industry-link svg{height:22px;width:22px;flex:none}.industry-link:hover{background:var(--soft);color:var(--gold2)}
.industry-link[aria-current="page"]{background:linear-gradient(105deg,rgba(215,180,106,.19),rgba(215,180,106,.035));border-color:var(--gold);color:var(--gold2);box-shadow:inset 3px 0 0 var(--gold)}
.industry-link:focus-visible,.workspace-brand:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.sidebar-decoration{height:180px;flex-shrink:0;margin-top:auto;opacity:.35;background:repeating-linear-gradient(135deg,transparent 0 28px,rgba(215,180,106,.25) 29px,transparent 30px 57px);mask-image:linear-gradient(transparent,#000)}
.shell{width:calc(100% - var(--sidebar-width));max-width:1680px;margin-left:var(--sidebar-width);margin-right:0;padding-inline:26px}
.dashboard-header{text-align:left}.dashboard-header h1{font-size:clamp(30px,3.3vw,52px)}
.grid{align-items:stretch;grid-auto-rows:1fr}.grid>.card{height:100%;display:flex}.grid>.card>.card-body{width:100%;display:flex;flex-direction:column;min-width:0}.grid .card h2,.grid .segment,.grid .detail-row{overflow-wrap:anywhere}.grid .rule{margin-top:auto;flex-shrink:0}.grid .detail-row{flex-shrink:0}.detail-row>span:first-child{font-weight:600}
.research-copy{font-size:18px;line-height:1.75;margin:0 0 20px;max-width:1200px}.recipient-role{overflow-wrap:anywhere}
.skip-link{position:fixed;left:225px;top:-100px;z-index:20;background:var(--gold2);color:var(--bg);padding:12px 18px;border-radius:6px}.skip-link:focus{top:12px}
@media(min-width:1800px){.shell{margin-inline:auto;padding-left:calc(var(--sidebar-width) + 26px);width:100%;max-width:1890px}}
@media(max-width:1180px){:root{--sidebar-width:190px}.shell{padding-inline:20px}}
@media(max-width:700px){.industry-sidebar{position:sticky;top:0;width:100%;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line);display:block;background:rgba(8,8,7,.98)}.workspace-brand{flex-direction:row;justify-content:flex-start;padding:0 0 10px;gap:10px;font-size:10px;text-align:left}.workspace-brand svg{width:26px;height:30px}.workspace-brand small{font-size:7px;margin-top:5px}.nav-caption,.sidebar-decoration{display:none}#industry-navigation{flex-direction:row;gap:8px;overflow:auto}.industry-link{padding:9px 12px;font-size:11px;white-space:nowrap}.industry-link svg{width:18px;height:18px}.shell{width:100%;margin:0;padding:18px 14px 40px}.dashboard-header{padding-top:10px}.skip-link{left:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}

.recipient-email{padding:18px 0;margin:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.email-label{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:8px}.email-address{display:block;color:var(--gold2);font-size:17px;line-height:1.6;overflow-wrap:anywhere;text-underline-offset:4px}.email-missing{display:block;color:var(--muted);font-size:15px}.email-verification{display:inline-block;margin-top:10px;font-size:11px;line-height:1.5;padding:5px 8px;border-radius:5px;border:1px solid var(--line)}.email-verified{color:#80d3a0;border-color:rgba(128,211,160,.35)}.email-pending{color:var(--gold2)}.email-source{color:var(--gold2);font-size:12px;text-underline-offset:4px}

.card-heading{display:flex;align-items:flex-start;gap:12px;margin-bottom:9px}.card-heading h2{flex:1;min-width:0;margin:0}
.outreach-indicators{display:grid;grid-template-columns:repeat(3,22px);gap:5px;flex:none;padding-top:3px}
.outreach-channel{display:flex;flex-direction:column;align-items:center;gap:8px}.outreach-icon{width:15px;height:15px;color:var(--muted);display:block}
.outreach-dot{appearance:none;display:block;width:14px;height:14px;padding:0;border:1px solid #77766f;border-radius:50%;background:transparent;cursor:pointer;flex:none;transition:box-shadow .15s,transform .15s}
.outreach-dot:hover{transform:scale(1.15);box-shadow:0 0 0 4px rgba(255,255,255,.08)}.outreach-dot:focus-visible{outline:2px solid var(--gold2);outline-offset:5px}
.outreach-dot[data-state="contacted"],.status-swatch[data-state="contacted"]{background:#f49b38;border-color:#f49b38}.outreach-dot[data-state="positive"],.status-swatch[data-state="positive"]{background:#39c97a;border-color:#39c97a}.outreach-dot[data-state="negative"],.status-swatch[data-state="negative"]{background:#ed6262;border-color:#ed6262}
.outreach-editor{width:min(430px,calc(100% - 32px));border:1px solid var(--gold);border-radius:14px;background:var(--panel);color:var(--ink);padding:26px;font-family:var(--sans);box-shadow:0 24px 80px #000}.outreach-editor::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
.outreach-editor h2{font-size:22px;line-height:1.4;margin:0 0 7px}.outreach-editor p{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 20px}.outreach-options{display:grid;gap:9px}
.outreach-option{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:12px var(--sans);text-align:left;cursor:pointer}.outreach-option:hover,.outreach-option[aria-pressed="true"]{background:var(--soft);border-color:var(--gold)}.outreach-option:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}.status-swatch{width:13px;height:13px;display:inline-block;border:1px solid #77766f;border-radius:50%;flex:none}.outreach-cancel{margin-top:18px;color:var(--muted);background:transparent;border:0;padding:5px 0;font:12px var(--sans);text-decoration:underline;text-underline-offset:4px;cursor:pointer}.outreach-editor .outreach-storage-note{font-size:10px;margin:16px 0 0}

.building-tag{display:inline-block;padding:4px 7px;margin-right:8px;border:1px solid var(--gold);border-radius:5px;color:var(--gold2);font-weight:700;letter-spacing:.08em}.building-tag[data-tag="UD"]{color:#b9ccec;border-color:#637c9f}.building-card{min-height:420px}.building-card .detail-row{align-items:flex-start}.building-card .value{overflow-wrap:anywhere}.building-source-fields{display:grid;gap:16px}.building-source-fields dt{color:var(--muted);font-size:12px;margin-bottom:6px}.building-source-fields dd{margin:0;font-size:16px;line-height:1.6;overflow-wrap:anywhere}.building-source-fields a{color:var(--gold2)}
.developer-buildings{list-style:none;padding:0;margin:0;display:grid;gap:13px}.developer-buildings li{display:flex;align-items:flex-start;gap:9px;font-size:12px;line-height:1.6;overflow-wrap:anywhere}.developer-buildings .building-tag{flex:none;font-size:9px;margin:0;padding:2px 5px}.developer-card .card-body{height:auto;min-height:100%;display:block}.developer-grid{align-items:stretch;grid-auto-rows:auto}.developer-grid .rule{margin:16px 0 20px}.developer-grid .card{height:auto;min-height:260px}
.building-tag[data-tag="RV"]{color:var(--muted);border-color:#77766f}.portfolio-scope{display:block;color:var(--muted);font-size:10px}
.contact-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}.contact-heading h4{flex:1;min-width:0;margin:0;overflow-wrap:anywhere}.contact-outreach{flex:none;margin:0;padding:0}.contact-outreach .outreach-indicators{justify-content:flex-end;gap:12px}.contact-outreach .outreach-channel{min-width:24px}.contact-outreach .recipient-meta{display:none}.contact-outreach .outreach-icon{width:15px;height:15px}.contact-outreach .outreach-dot{width:14px;height:14px}

function outreachKey(industry,name){return JSON.stringify([industry,name])}
function getOutreachStatus(industry,p,channel){const key=outreachKey(industry,p.name);const value=(sharedEnabled?sharedOverrides[key]?.[channel]:outreachOverrides[key]?.[channel])??p.outreach?.[channel]??'none';return Object.prototype.hasOwnProperty.call(outreachStatusLabels,value)?value:'none'}

function contactIdentity(c){return c.id||c.email?.trim().toLowerCase()||c.name.trim().toLowerCase()}
function getContactStatus(industry,p,c,channel){const key=contactOutreachKey(industry,p.name,contactIdentity(c));const status=(sharedEnabled?sharedOverrides:outreachOverrides)[key]?.[channel]??'none';return Object.hasOwn(outreachStatusLabels,status)?status:'none'}

function renderContactOutreach(p,c){const id=contactIdentity(c);return `<div class="contact-outreach" data-contact-id="${escapeHtml(id)}" data-company-name="${escapeHtml(p.name)}" data-industry="${escapeHtml(activeIndustry)}"><div class="outreach-indicators" role="group" aria-label="Outreach for ${escapeHtml(c.name)}">${outreachChannels.map(channel=>{const status=getContactStatus(activeIndustry,p,c,channel.key);return `<div class="outreach-channel"><svg class="outreach-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${channel.icon}</svg><button type="button" class="outreach-dot" data-state="${status}" data-contact-channel="${channel.key}" title="${escapeHtml(channel.label+': '+outreachStatusLabels[status])}" aria-label="${escapeHtml(c.name+' · '+channel.label+': '+outreachStatusLabels[status])}" aria-haspopup="dialog" aria-controls="outreach-editor"></button><span class="recipient-meta">${channel.label}</span></div>`}).join('')}</div></div>`}
function refreshContactIndicators(){document.querySelectorAll('.contact-outreach').forEach(group=>{const p=industries[group.dataset.industry]?.prospects.find(p=>p.name===group.dataset.companyName);const c=p?.contacts?.find(c=>contactIdentity(c)===group.dataset.contactId);if(!c)return;group.querySelectorAll('[data-contact-channel]').forEach(button=>{const channel=button.dataset.contactChannel,status=getContactStatus(group.dataset.industry,p,c,channel);button.dataset.state=status;button.title=outreachChannels.find(x=>x.key===channel).label+': '+outreachStatusLabels[status];button.setAttribute('aria-label',c.name+' · '+button.title);});});}

function makeDeveloperCard(p,i){return `<article class="card developer-card"><div class="card-body"><div class="card-heading"><h2><button type="button" class="prospect-title" id="prospect-${i}" data-prospect-index="${i}" aria-haspopup="dialog" aria-controls="prospect-dialog">${escapeHtml(p.name)}</button></h2>${renderOutreachIndicators(p,i)}</div><div class="rule"></div>${developerBuildingList(p)}</div></article>`;}
function renderDeveloperResearch(p){return `<section class="recipient-section"><h3>Mapped buildings · ${p.mappedBuildingCount}</h3>${p.portfolioResearchNote?`<p class="research-copy">${escapeHtml(p.portfolioResearchNote)}</p>${p.portfolioResearchSource?`<a class="hq-source" href="${escapeHtml(p.portfolioResearchSource)}" target="_blank" rel="noopener noreferrer">Portfolio research source ↗</a>`:''}`:''}<p class="recipient-intro">Grouped from the High Rise Luxury Buildings page. Joint developments appear under each named partner. CP = Completed; UD = Under Development; RV = Delivery status to confirm. Both pages use the same building records; developer relationships retain their individual source notes. These associations do not establish current ownership or purchasing authority.</p><div class="recipient-grid">${p.buildings.map(b=>`<div class="recipient"><h4><span class="building-tag" data-tag="${b.tag}">${b.tag}</span>${escapeHtml(b.name)}</h4><p class="recipient-role">${escapeHtml(b.developerAttribution)}</p><p class="recipient-meta">${escapeHtml(b.researchStatus)}${b.relationship?' · '+escapeHtml(b.relationship):''}${b.scopeReview?' · Scope review':''}</p>${renderStatusVerification(b)}${b.note?`<p class="recipient-meta">${escapeHtml(b.note)}</p>`:''}${b.source?`<a class="hq-source" href="${escapeHtml(b.source)}" target="_blank" rel="noopener noreferrer">Developer source ↗</a>`:''}</div>`).join('')}</div></section>${renderDeveloperContacts(p)}`;}

function renderDeveloperContacts(p){return `<section class="recipient-section" aria-labelledby="developer-contacts-heading"><h3 id="developer-contacts-heading">Potential contacts · ${(p.contacts||[]).length}</h3><p class="recipient-intro"><strong>${escapeHtml(p.contactCoverageNote)}</strong><br>${escapeHtml(p.contactResearchNote)}</p>${p.contactResearchSource?`<a class="hq-source" href="${escapeHtml(p.contactResearchSource)}" target="_blank" rel="noopener noreferrer">Research / referral source ↗</a>`:''}<div class="recipient-grid">${(p.contacts||[]).map(c=>`<div class="recipient"><div class="contact-heading"><h4>${escapeHtml(c.name)}</h4>${renderContactOutreach(p,c)}</div><p class="recipient-role">${escapeHtml(c.role)}</p><p class="recipient-meta"><strong>Organization:</strong> ${escapeHtml(c.employer)}<br><strong>Evidence:</strong> ${escapeHtml(c.evidence)}<br><strong>Suggested route:</strong> ${escapeHtml(c.route)}<br><strong>Research date:</strong> ${escapeHtml(c.researchedOn)}</p><p class="recipient-meta">${escapeHtml(c.note)}</p><p class="recipient-meta">${escapeHtml(c.fit)}</p>${c.email?`<a class="email-address" href="mailto:${escapeHtml(c.email)}">${escapeHtml(c.email)}</a><p class="recipient-meta">${escapeHtml(c.emailStatus)}</p>`:'<p class="recipient-meta"><strong>Email:</strong> Not found</p>'}<a class="hq-source" href="${escapeHtml(c.source)}" target="_blank" rel="noopener noreferrer">Role source ↗</a>${c.secondarySource?` · <a class="hq-source" href="${escapeHtml(c.secondarySource)}" target="_blank" rel="noopener noreferrer">Supporting source ↗</a>`:''}</div>`).join('')}</div></section>`;}

function buildingRows(p){return [['Status',p.constructionStatus||p.status],[p.buildingTag==='CP'?'Property management':'Developer',(p.buildingTag==='CP'?p.management:p.developer)||'Not provided'],[p.buildingTag==='CP'?'Developer':'Architecture',(p.buildingTag==='CP'?p.developer:p.architecture)||(p.developerResearchStatus==='Not confirmed'?'Not confirmed':'Not provided')]];}
function makeBuildingCard(p,i){return `<article class="card building-card"><div class="card-body"><div class="card-heading"><h2><button type="button" class="prospect-title" id="prospect-${i}" data-prospect-index="${i}" aria-haspopup="dialog" aria-controls="prospect-dialog">${escapeHtml(p.name)}</button></h2>${renderOutreachIndicators(p,i)}</div><div class="segment"><span class="building-tag" data-tag="${p.buildingTag}" title="${escapeHtml(p.status)}">${p.buildingTag}</span> ${escapeHtml(p.category)}${p.scopeReview?' · Scope review':''}${p.notes==='already a client'?' · Existing client':''}</div><div class="rule"></div>${buildingRows(p).map(([k,v])=>`<div class="detail-row"><span>${escapeHtml(k)}</span><span class="value">${escapeHtml(v)}</span></div>`).join('')}</div></article>`;}
function renderStatusVerification(p){return p.statusCheckedOn?`<section class="recipient-section"><h3>Status verification</h3><p class="recipient-role">${escapeHtml(p.constructionStatus)}</p><p class="research-copy">${escapeHtml(p.statusNote)}</p><p class="recipient-meta">Reviewed ${escapeHtml(p.statusCheckedOn)}. Earlier portfolio notes below are retained as historical research.</p><a class="hq-source" href="${escapeHtml(p.statusSource)}" target="_blank" rel="noopener noreferrer">Status evidence ↗</a></section>`:'';}
function renderBuildingContacts(p){if(p.buildingTag!=='CP')return '';const contacts=p.contacts||[];return `<section class="recipient-section"><h3>Building management & contacts${contacts.length?' · '+contacts.length:''}</h3><p class="recipient-intro"><strong>${escapeHtml(p.managerResearchStatus||'Not researched')}</strong><br>${escapeHtml(p.managerResearchNote||'')}<br>Reviewed: ${escapeHtml(p.managerResearchedOn||'Not recorded')}</p>${p.managerOfficeEmail?`<div class="recipient"><h4>General manager contact · full name unconfirmed</h4><a class="email-address" href="mailto:${escapeHtml(p.managerOfficeEmail)}">${escapeHtml(p.managerOfficeEmail)}</a><p class="recipient-meta">Published role contact; delivery and current assignment not verified.</p><a class="hq-source" href="${escapeHtml(p.managerOfficeSource)}" target="_blank" rel="noopener noreferrer">Management contact source ↗</a></div>`:''}<div class="recipient-grid">${contacts.map(c=>`<div class="recipient"><div class="contact-heading"><h4>${escapeHtml(c.name)}</h4>${renderContactOutreach(p,c)}</div><p class="recipient-role">${escapeHtml(c.role)}</p><p class="recipient-meta"><strong>${escapeHtml(c.assessment||c.evidence)}</strong>${c.employer?'<br>'+escapeHtml(c.employer):''}<br>Source date: ${escapeHtml(c.sourceDate||'Not stated')} · Reviewed ${escapeHtml(c.researchedOn)}</p>${c.email?`<a class="email-address" href="mailto:${escapeHtml(c.email)}">${escapeHtml(c.email)}</a><p class="recipient-meta">${escapeHtml(c.emailStatus)}</p>`:'<p class="recipient-meta">Email: Not found</p>'}${c.apolloCheckedOn?`<p class="recipient-meta"><strong>Apollo · ${escapeHtml(c.apolloCheckedOn)}</strong><br>${escapeHtml(c.apolloResult)}${c.apolloRole?'<br>Listed role: '+escapeHtml(c.apolloRole):''}${c.apolloCompany?'<br>Listed company: '+escapeHtml(c.apolloCompany):''}${c.apolloNote?'<br>'+escapeHtml(c.apolloNote):''}${c.emailNote?'<br>'+escapeHtml(c.emailNote):''}</p>${c.emailSource&&c.apolloResult==='Business email found'?`<a class="hq-source" href="${escapeHtml(c.emailSource)}" target="_blank" rel="noopener noreferrer">Apollo email source ↗</a>`:''}`:''}${c.publishedManagementEmail?`<p class="recipient-meta">Published management contact: <a href="mailto:${escapeHtml(c.publishedManagementEmail)}">${escapeHtml(c.publishedManagementEmail)}</a></p>`:''}<p class="research-copy">${escapeHtml(c.note)}</p><a class="hq-source" href="${escapeHtml(c.source)}" target="_blank" rel="noopener noreferrer">Role source ↗</a>${c.secondarySource?` · <a class="hq-source" href="${escapeHtml(c.secondarySource)}" target="_blank" rel="noopener noreferrer">Supporting / conflicting source ↗</a>`:''}</div>`).join('')}</div></section>`;}
function renderBuildingResearch(p){return `${p.forbesRecognition?`<section class="recipient-section"><h3>Forbes Travel Guide recognition</h3><p class="recipient-role">${escapeHtml(p.forbesRecognition.designation)}</p><p class="recipient-meta">${escapeHtml(p.forbesRecognition.nameAsListed)}<br>${escapeHtml(p.forbesRecognition.address)}<br>${escapeHtml(p.forbesRecognition.city)}</p>${p.existingClient?'<p class="recipient-role">Existing Scent Company client · exclude from cold outreach</p>':''}<p class="research-copy">${escapeHtml(p.forbesRecognition.note)}</p><p class="recipient-meta">Reviewed ${escapeHtml(p.forbesRecognition.checkedOn)}</p><a class="hq-source" href="${escapeHtml(p.forbesRecognition.source)}" target="_blank" rel="noopener noreferrer">Forbes directory ↗</a></section>`:''}<dl class="dialog-summary">${buildingRows(p).map(([k,v])=>`<div><dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd></div>`).join('')}</dl>${renderBuildingContacts(p)}${renderStatusVerification(p)}${p.importNote?`<p class="hq-note">${escapeHtml(p.importNote)}</p>`:''}<section class="recipient-section"><h3>Developer relationships & research</h3><p class="recipient-intro">CP = Completed; UD = Under Development; RV = Delivery status to confirm. Source dates and qualifications vary. An original developer or portfolio association does not establish current purchasing authority.</p>${(p.developerAssociations||[]).map(a=>`<div class="recipient"><h4>${escapeHtml(a.developerName)}</h4><p class="recipient-role">${escapeHtml(a.relationship||'Mapped developer association')}</p><p class="recipient-meta">${escapeHtml(a.researchStatus)}</p><p class="research-copy">${escapeHtml(a.note)}</p>${a.source?`<a class="hq-source" href="${escapeHtml(a.source)}" target="_blank" rel="noopener noreferrer">Developer source ↗</a>`:''}</div>`).join('')}${!(p.developerAssociations||[]).length?`<p class="research-copy">${escapeHtml(p.developerNote||'Developer not confirmed.')}</p>`:''}</section>${(p.sourceRecords||[]).length?`<section class="recipient-section"><h3>Airtable research & contacts</h3><p class="recipient-intro">Original snapshot imported October 19, 2026. Source fields are preserved below.</p>${p.sourceRecords.map(source=>`<div class="recipient"><h4>${escapeHtml(source.table)}</h4><dl class="building-source-fields">${Object.entries(source.fields).map(([label,value])=>`<div><dt>${escapeHtml(label)}</dt><dd>${buildingField(value)}</dd></div>`).join('')}</dl><a class="hq-source" href="${escapeHtml(source.url)}" target="_blank" rel="noopener noreferrer">Open Airtable record ↗</a></div>`).join('')}</section>`:''}`;}

function buildingField(value){const text=String(value??'');if(text.startsWith('https://')||text.startsWith('http://'))return `<a href="${escapeHtml(text)}" target="_blank" rel="noopener noreferrer">${escapeHtml(text)}</a>`;if(text.includes('@')&&!text.includes(' '))return `<a href="mailto:${escapeHtml(text)}">${escapeHtml(text)}</a>`;return escapeHtml(text);}

function makeCard(p,i){if(activeIndustry==='developers')return makeDeveloperCard(p,i);if(activeIndustry==='buildings')return makeBuildingCard(p,i);return `<article class="card"><div class="card-body"><div class="card-heading"><h2><button type="button" class="prospect-title" id="prospect-${i}" data-prospect-index="${i}" aria-haspopup="dialog" aria-controls="prospect-dialog">${escapeHtml(p.name)}</button></h2>${renderOutreachIndicators(p,i)}</div><div class="segment">${escapeHtml(p.category)}</div><div class="rule"></div><div class="detail-row"><span>${escapeHtml(industries[activeIndustry].footprintLabel)}</span><span class="value" title="${escapeHtml(p.storeNote||'')}">${escapeHtml(displayFootprint(p))}</span></div><div class="detail-row"><span>${escapeHtml(industries[activeIndustry].revenueLabel)}</span><span class="value" title="${escapeHtml(p.revenueNote||'')}" data-source="${escapeHtml(p.revenueSource||'')}">${escapeHtml(p.revenue)}</span></div><div class="detail-row"><span>Segment</span><span class="value">${escapeHtml(p.category)}</span></div><div class="detail-row"><span>Country of origin</span><span class="value" title="${escapeHtml(p.originNote)}">${escapeHtml(p.countryOfOrigin)}</span></div></div></article>`}
function render(){refreshContactIndicators();const q=search.value.trim().toLocaleLowerCase('en-US'),cat=categoryFilter.value;const rows=prospects.map((p,i)=>({...p,_i:i})).filter(p=>(activeOutreachFilter==='all'||hasPriorOutreach(activeIndustry,p)===(activeOutreachFilter==='contacted'))&&(activeStatus==='all'||p.status===activeStatus)&&(cat==='all'||p.category===cat)&&(!q||[p.name,p.category,p.countryOfOrigin,p.stores,p.revenue,p.reason,p.ownership,p.examples,p.management,p.developer,p.architecture,p.salesMarketing,p.notes,p.buildingTag,...(p.buildings||[]).map(b=>b.name)].join(' ').toLocaleLowerCase('en-US').includes(q))).sort((a,b)=>{const count=p=>{if(activeIndustry==='developers')return p.mappedBuildingCount;const m=String(p.stores).replace(/,/g,'').match(/\d+/);return m?Number(m[0]):-1};return count(b)-count(a)||a.name.localeCompare(b.name,'en-US')});document.getElementById('shownCount').textContent=rows.length;grid.innerHTML=rows.length?rows.map((p,i)=>makeCard(p,p._i)).join(''):'<div class="empty">No prospects match this search.</div>'}
const prospectDialog=document.getElementById('prospect-dialog');
let dialogTrigger=null;
function renderRecipients(p){
 const contacts=p.contacts||[];
 return `<section class="recipient-section" aria-labelledby="recipients-heading"><h3 id="recipients-heading">Potential contacts${contacts.length?` · ${contacts.length}`:''}</h3><p class="recipient-intro">${p.contactCoverageNote?`<strong>${escapeHtml(p.contactCoverageNote)}</strong><br>`:''}${escapeHtml(p.contactResearchNote)} Company statuses do not identify which person was contacted. Track each person separately below. A matching city does not confirm that a person works at the street address above.</p>${contacts.length?`<ul class="recipient-grid">${contacts.map(c=>`<li class="recipient"><div class="contact-heading"><h4>${escapeHtml(c.name)}</h4>${renderContactOutreach(p,c)}</div><p class="recipient-role">${escapeHtml(c.role)}</p><div class="recipient-email"><span class="email-label">Business email</span>${c.email?`<a class="email-address" href="mailto:${escapeHtml(c.email)}">${escapeHtml(c.email)}</a>`:'<span class="email-missing">Not available</span>'}<span class="email-verification ${c.emailStatus==='Verified in Apollo'?'email-verified':'email-pending'}">${escapeHtml(c.emailStatus)}</span><p class="recipient-meta">${c.apolloRole?`<strong>Apollo-listed role:</strong> ${escapeHtml(c.apolloRole)}<br>`:''}${c.apolloCompany?`<strong>Apollo-listed employer:</strong> ${escapeHtml(c.apolloCompany)}<br>`:''}<strong>Checked:</strong> ${escapeHtml(c.emailCheckedOn)}<br>${escapeHtml(c.emailNote)}</p>${c.emailSource?`<a class="email-source" href="${escapeHtml(c.emailSource)}" target="_blank" rel="noopener noreferrer">${escapeHtml(c.emailSourceLabel||'Apollo source')} ↗</a>`:''}</div><span class="recipient-status">${escapeHtml(c.evidence)}</span><p class="recipient-meta"><strong>Publicly listed location:</strong> ${escapeHtml(c.location)}<br><strong>Headquarters:</strong> ${escapeHtml(c.hqStatus)}<br><strong>Potential fit:</strong> ${escapeHtml(c.fit)}</p><p class="recipient-meta">${escapeHtml(c.note)}</p><div class="recipient-links">${c.source?`<a href="${escapeHtml(c.source)}" target="_blank" rel="noopener noreferrer">Professional source ↗</a>`: ''}${c.secondarySource?`<a href="${escapeHtml(c.secondarySource)}" target="_blank" rel="noopener noreferrer">Supporting source ↗</a>`:''}</div></li>`).join('')}</ul>`:''}</section>`;
}
function renderFashionResearch(p){return `<section class="dialog-headquarters" aria-labelledby="headquarters-heading"><h3 id="headquarters-heading">Headquarters</h3><dl><div><dt>Headquarters city</dt><dd>${escapeHtml(p.hqCity)}</dd></div><div><dt>Headquarters address</dt><dd>${escapeHtml(p.hqAddress)}</dd></div></dl>${p.hqNote?`<p class="hq-note">${escapeHtml(p.hqNote)}</p>`:''}<a class="hq-source" href="${escapeHtml(p.hqSource)}" target="_blank" rel="noopener noreferrer">Headquarters source</a></section>${renderRecipients(p)}`;}
function renderCorporateContactRoutes(p){const routes=p.corporateContactRoutes||[];return routes.length?`<section class="recipient-section"><h3>Corporate contact routes</h3><p class="recipient-intro">Shared company inboxes for internal routing, not addresses assigned to the people above. No independent email verification performed.</p><ul class="recipient-grid">${routes.map(route=>`<li class="recipient"><h4>${escapeHtml(route.label)}</h4><p><a class="email-address" href="mailto:${escapeHtml(route.email)}">${escapeHtml(route.email)}</a></p><a href="${escapeHtml(route.source)}" target="_blank" rel="noopener noreferrer">Published source ↗</a></li>`).join('')}</ul></section>`:'';}
function renderHotelResearch(p){
 return `<section class="recipient-section" aria-labelledby="portfolio-heading"><h3 id="portfolio-heading">Portfolio & ownership</h3><p class="recipient-intro">${escapeHtml(p.status)}${p.exception?' · Minimum-size exception: fewer than five US hotels.':''}</p><div class="recipient-grid"><div class="recipient"><h4>Total portfolio</h4><p class="recipient-role">${escapeHtml(p.totalPortfolio)}</p><p class="recipient-meta"><strong>Ownership & leadership</strong><br>${escapeHtml(p.ownership)}</p></div><div class="recipient"><h4>Representative properties</h4><p class="recipient-role">${escapeHtml(p.examples)}</p></div></div></section><section class="recipient-section" aria-labelledby="revenue-heading"><h3 id="revenue-heading">Annual revenue · USD</h3><p class="recipient-role">${escapeHtml(p.revenue)}</p><p class="research-copy">${escapeHtml(p.revenueNote)}</p><p class="recipient-intro"><strong>Basis:</strong> ${escapeHtml(p.revenueBasis)}<br><strong>Fiscal year / source timing:</strong> ${escapeHtml(p.revenuePeriod)}<br><strong>Confidence:</strong> ${escapeHtml(p.revenueConfidence)}<br><strong>Research date:</strong> October 14, 2026. Company estimates, managed hotel sales and wider-group sales use different scopes and should not be compared directly.</p><div class="recipient-links"><a href="${escapeHtml(p.revenueSource)}" target="_blank" rel="noopener noreferrer">Revenue source ↗</a></div></section><section class="recipient-section" aria-labelledby="research-heading"><h3 id="research-heading">Research notes</h3><p class="research-copy">${escapeHtml(p.reason)}</p><p class="recipient-intro">Family or founder leadership does not establish purchasing authority or faster decision-making. Confirm the luxury positioning and buying process of each target property.</p><div class="recipient-links"><a href="${escapeHtml(p.portfolioSource)}" target="_blank" rel="noopener noreferrer">Portfolio source ↗</a><a href="${escapeHtml(p.additionalSource)}" target="_blank" rel="noopener noreferrer">Supporting source ↗</a></div></section>${renderRecipients(p)}${renderCorporateContactRoutes(p)}<section class="recipient-section"><h3>Sample delivery</h3><p class="recipient-intro">Confirm the recipient’s current office and delivery address before sending a sample package.</p></section>`;
}
function openProspectDetails(index,trigger){
 const p=prospects[index];if(!p)return;
 dialogTrigger=trigger;
 document.getElementById('dialog-title').textContent=p.name;
 const websiteLink=document.getElementById('dialog-website');
 websiteLink.hidden=!p.website;
 if(activeIndustry==='developers'){websiteLink.hidden=false;if(p.website){websiteLink.href=p.website;websiteLink.textContent=p.websiteLabel||new URL(p.website).hostname.replace(/^www\./,'');websiteLink.setAttribute('aria-label',p.name+' — '+(p.websiteLabel||'company website')+' (opens in a new tab)')}else{websiteLink.removeAttribute('href');websiteLink.textContent='Official website not confirmed';websiteLink.removeAttribute('aria-label')}websiteLink.title=p.websiteNote||'';document.getElementById('dialog-segment').textContent='Developer · '+p.mappedBuildingCount+' mapped buildings';document.getElementById('dialog-content').innerHTML=renderDeveloperResearch(p);document.documentElement.classList.add('details-open');prospectDialog.showModal();prospectDialog.scrollTop=0;return;}
 if(activeIndustry==='buildings'){if(p.website){websiteLink.href=p.website;websiteLink.textContent=new URL(p.website).hostname.replace(/^www\./,'')}else websiteLink.removeAttribute('href');document.getElementById('dialog-segment').textContent=p.buildingTag+' · '+p.status;document.getElementById('dialog-content').innerHTML=renderBuildingResearch(p);document.documentElement.classList.add('details-open');prospectDialog.showModal();prospectDialog.scrollTop=0;return;}
 websiteLink.href=p.website;
 websiteLink.textContent=new URL(p.website).hostname.replace(/^www\./,'');
 websiteLink.setAttribute('aria-label',p.name+' official website (opens in a new tab)');
 document.getElementById('dialog-segment').textContent=p.category;
 const summary=[[industries[activeIndustry].footprintLabel,displayFootprint(p)],[industries[activeIndustry].revenueLabel,p.revenue],['Segment',p.category],['Country of origin',p.countryOfOrigin]];
 document.getElementById('dialog-content').innerHTML=`<dl class="dialog-summary">${summary.map(([label,value])=>`<div><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd></div>`).join('')}</dl>${industries[activeIndustry].detailsType==='hotels'?renderHotelResearch(p):renderFashionResearch(p)}`;
 document.documentElement.classList.add('details-open');
 prospectDialog.showModal();
 prospectDialog.scrollTop=0;
}
grid.addEventListener('click',event=>{
 const button=event.target.closest('button[data-prospect-index]');
 if(button&&grid.contains(button))openProspectDetails(Number(button.dataset.prospectIndex),button);
});
document.getElementById('dialog-close').addEventListener('click',()=>prospectDialog.close());
let backdropPressed=false;
prospectDialog.addEventListener('pointerdown',event=>{backdropPressed=event.target===prospectDialog});
prospectDialog.addEventListener('click',event=>{
 if(backdropPressed&&event.target===prospectDialog){const rect=prospectDialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)prospectDialog.close()}
 backdropPressed=false;
});
prospectDialog.addEventListener('close',()=>{
 document.documentElement.classList.remove('details-open');
 if(dialogTrigger?.isConnected)dialogTrigger.focus();
 dialogTrigger=null;
});
document.querySelectorAll('[data-outreach-filter]').forEach(button=>button.addEventListener('click',()=>{activeOutreachFilter=button.dataset.outreachFilter;document.querySelectorAll('[data-outreach-filter]').forEach(option=>{const selected=option===button;option.classList.toggle('active',selected);option.setAttribute('aria-pressed',String(selected))});render()}));
search.addEventListener('input',render);categoryFilter.addEventListener('change',render);document.querySelectorAll('.filter[data-status]').forEach(b=>b.addEventListener('click',()=>{activeStatus=b.dataset.status;document.querySelectorAll('.filter[data-status]').forEach(x=>x.classList.toggle('active',x===b));render()}));


const outreachEditor=document.getElementById('outreach-editor');
let outreachEditing=null;
function openOutreachEditor(button){
 const index=Number(button.dataset.outreachIndex),channel=button.dataset.outreachChannel;
 const p=prospects[index],definition=outreachChannels.find(c=>c.key===channel);if(!p||!definition)return;
 outreachEditing={industry:activeIndustry,name:p.name,index,channel};
 document.getElementById('outreach-editor-title').textContent=p.name+' · '+definition.label;
 const current=getOutreachStatus(activeIndustry,p,channel);
 outreachEditor.querySelectorAll('[data-set-outreach-status]').forEach(option=>option.setAttribute('aria-pressed',String(option.dataset.setOutreachStatus===current)));
 document.getElementById('outreach-storage-note').textContent=sharedEnabled?'Changes are shared with your team after saving.':'Changes are saved in this browser.';
 outreachEditor.showModal();
}
grid.addEventListener('click',event=>{const button=event.target.closest('button[data-outreach-channel]');if(button&&grid.contains(button))openOutreachEditor(button)});
prospectDialog.addEventListener('click',event=>{
 const button=event.target.closest('[data-contact-channel]');if(!button)return;
 const group=button.closest('.contact-outreach'),industry=group.dataset.industry;
 const p=industries[industry].prospects.find(p=>p.name===group.dataset.companyName);
 const c=p?.contacts?.find(c=>contactIdentity(c)===group.dataset.contactId);if(!c)return;
 const channel=button.dataset.contactChannel;
 outreachEditing={industry,name:p.name,contactId:contactIdentity(c),channel,trigger:button};
 document.getElementById('outreach-editor-title').textContent=c.name+' · '+outreachChannels.find(x=>x.key===channel).label;
 const current=getContactStatus(industry,p,c,channel);
 outreachEditor.querySelectorAll('[data-set-outreach-status]').forEach(option=>option.setAttribute('aria-pressed',String(option.dataset.setOutreachStatus===current)));
 document.getElementById('outreach-storage-note').textContent=sharedEnabled?'This person’s status is shared with your team.':'This person’s status is saved in this browser.';
 outreachEditor.showModal();
});
outreachEditor.addEventListener('click',async event=>{
 const option=event.target.closest('button[data-set-outreach-status]');if(!option||!outreachEditing)return;
 const status=option.dataset.setOutreachStatus;if(!Object.prototype.hasOwnProperty.call(outreachStatusLabels,status))return;
 if(sharedEnabled){
  const buttons=[...outreachEditor.querySelectorAll('[data-set-outreach-status]')];
  buttons.forEach(b=>b.disabled=true);
  try{
   if(!sharedStore?.ready)throw new Error('Sign in and connect to shared statuses before editing.');
   const editing={...outreachEditing};
   await sharedStore.save(editing,status);
   outreachEditor.close();render();
  }catch(error){document.getElementById('outreach-storage-note').textContent=error.message||'Could not save. Your change has not been shared.';}
  finally{buttons.forEach(b=>b.disabled=false);}
  return;
 }
 const key=outreachEditing.contactId?contactOutreachKey(outreachEditing.industry,outreachEditing.name,outreachEditing.contactId):outreachKey(outreachEditing.industry,outreachEditing.name);
 outreachOverrides[key]={...outreachOverrides[key],[outreachEditing.channel]:status};
 try{localStorage.setItem(outreachStorageKey,JSON.stringify(outreachOverrides));outreachEditor.close();render()}catch{render();document.getElementById('outreach-storage-note').textContent='Updated for this session. Browser storage is unavailable; this change may be lost when the page closes.';option.setAttribute('aria-pressed','true')}
});
document.getElementById('outreach-cancel').addEventListener('click',()=>outreachEditor.close());
outreachEditor.addEventListener('close',()=>{
 if(outreachEditing?.contactId){outreachEditing.trigger?.focus();outreachEditing=null;return;}
 if(outreachEditing&&outreachEditing.industry===activeIndustry){const target=[...grid.querySelectorAll('[data-outreach-channel]')].find(b=>Number(b.dataset.outreachIndex)===outreachEditing.index&&b.dataset.outreachChannel===outreachEditing.channel);target?.focus()}
 outreachEditing=null;
});
window.addEventListener('storage',event=>{if(sharedEnabled||event.key!==outreachStorageKey)return;try{const value=JSON.parse(event.newValue||'{}');outreachOverrides=value&&typeof value==='object'&&!Array.isArray(value)?value:{};render()}catch{}});

const industryNavigation=document.getElementById('industry-navigation');
const navIcon={developers:'<path d="M4 21V5h7v16M11 21V9h9v12M2 21h20M7 8v1m0 3v1m0 3v1m8-5v1m2-1v1m-2 3v1m2-1v1"/>',buildings:'<path d="M4 21V7h7v14M11 21V3h9v18M2 21h20M7 10v1m0 3v1m8-9v1m2-1v1m-2 3v1m2-1v1m-2 3v1m2-1v1"/>',fashion:'<path d="M6 8h12l1 12H5L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',hotels:'<path d="M6 21V3h12v18M3 21h18M10 21v-4h4v4M9 7h1m4 0h1M9 11h1m4 0h1"/>'};
industryNavigation.innerHTML=Object.entries(industries).map(([key,industry])=>`<a class="industry-link" href="#${escapeHtml(key)}" data-industry="${escapeHtml(key)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${navIcon[key]||navIcon.fashion}</svg><span>${escapeHtml(industry.label)}</span></a>`).join('');
function activateIndustry(){
 const requested=location.hash.slice(1);
 const next=Object.prototype.hasOwnProperty.call(industries,requested)?requested:'fashion';
 industryState.set(activeIndustry,{query:search.value,category:categoryFilter.value,status:activeStatus,outreach:activeOutreachFilter});
 if(prospectDialog.open)prospectDialog.close();
 activeIndustry=next;
 const industry=industries[next];
 prospects=industry.prospects;
 grid.classList.toggle('developer-grid',next==='developers');
 document.querySelectorAll('.filter[data-status]').forEach((button,i)=>button.hidden=next==='developers'&&i>0);
 categoryFilter.hidden=next==='developers';
 const state=industryState.get(next)||{query:'',category:'all',status:'all'};
 search.value=state.query;activeStatus=state.status;activeOutreachFilter=state.outreach||'all';
 document.querySelectorAll('[data-outreach-filter]').forEach(button=>{const selected=button.dataset.outreachFilter===activeOutreachFilter;button.classList.toggle('active',selected);button.setAttribute('aria-pressed',String(selected))});
 const statuses=next==='buildings'?[['all','All'],['Completed','CP · Completed'],['Under Development','UD · Under Development'],['Needs Validation','RV · Status to confirm']]:[['all','All'],['Initial Research','Initial Research'],['Needs Validation','Needs Validation']];
 document.querySelectorAll('.filter[data-status]').forEach((button,i)=>{const option=statuses[i];button.hidden=!option||(next==='developers'&&i>0);if(option){button.dataset.status=option[0];button.textContent=option[1]}});
 categoryFilter.innerHTML='<option value="all">All segments</option>';
 for(const category of [...new Set(prospects.map(p=>p.category))].sort((a,b)=>a.localeCompare(b,'en-US'))){const option=document.createElement('option');option.value=category;option.textContent=category;categoryFilter.append(option)}
 categoryFilter.value=state.category;
 document.querySelectorAll('.filter[data-status]').forEach(button=>button.classList.toggle('active',button.dataset.status===activeStatus));
 document.querySelectorAll('.industry-link').forEach(link=>{if(link.dataset.industry===next)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')});
 document.getElementById('industry-title').textContent=industry.title;
 document.title=industry.label+' | Prospecting Dashboard';
 document.getElementById('industry-footer').textContent='Research updated '+industry.updated+' · '+(next==='developers'?'Developers grouped from mapped buildings · Joint projects appear under each partner · Original developer does not establish current purchasing authority.':next==='buildings'?'Airtable + developer research · Shared building records across both pages · CP = Completed · UD = Under Development · RV = Delivery status to confirm.':next==='hotels'?'All revenue figures are in USD · Estimates, periods and revenue scope are explained inside each card.':'Sources and qualifications are available inside each card. Validate before finalizing the SAM.');
 render();
 window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('hashchange',activateIndustry);
activateIndustry();
</script>
<script>
(async function initializeSharedStatuses(){
 if(!sharedEnabled)return;
 const bar=document.createElement('section');bar.setAttribute('aria-label','Shared status access');
 bar.style.cssText='margin:12px 0 20px;padding:12px;border:1px solid var(--gold);border-radius:8px;font:12px var(--sans)';
 bar.innerHTML='<p role="status" id="shared-message">Connecting to shared statuses…</p><form id="shared-login"><label>Email <input name="email" type="email" autocomplete="email" required style="padding:8px;margin:6px;background:#111;color:white;border:1px solid #888;border-radius:4px"></label><button class="filter" type="submit">Send sign-in link</button></form><button class="filter" id="shared-logout" hidden>Sign out</button>';
 document.querySelector('.dashboard-header').after(bar);
 const message=bar.querySelector('#shared-message'),form=bar.querySelector('form'),logout=bar.querySelector('#shared-logout');
 logout.style.cssText='margin:20px 16px;align-self:flex-start';
 document.getElementById('industry-navigation').after(logout);
 let client,session=null,refreshing=false,sessionVersion=0;
 function say(text){bar.hidden=false;message.textContent=text;}
 async function refresh(){
  if(!session||refreshing)return;
  refreshing=true;const version=sessionVersion;
  try{
   const membership=await client.from('dashboard_editors').select('user_id').eq('user_id',session.user.id).maybeSingle();
   if(membership.error)throw membership.error;
   if(!membership.data)throw new Error('This account has not been granted dashboard access.');
   const result=await client.from('outreach_statuses').select('industry,prospect_name,channel,status');
   const contacts=await client.from('contact_outreach_statuses').select('industry,prospect_name,contact_id,channel,status');
   if(contacts.error)throw new Error('Contact statuses need the database update: '+contacts.error.message);
   if(result.error)throw result.error;
   if(version!==sessionVersion)return;
   const next={};for(const row of result.data){const key=outreachKey(row.industry,row.prospect_name);next[key]={...next[key],[row.channel]:row.status};}
   for(const row of contacts.data){const key=contactOutreachKey(row.industry,row.prospect_name,row.contact_id);next[key]={...next[key],[row.channel]:row.status};}
   sharedOverrides=next;sharedStore.ready=true;render();bar.hidden=true;
  }catch(error){if(version===sessionVersion){sharedStore.ready=false;say('Shared statuses unavailable: '+error.message);}}
  finally{refreshing=false;}
 }
 try{
  const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  client=createClient(sharedConfig.url,sharedConfig.publishableKey);
  sharedStore={ready:false,async save(editing,status){
   const row={industry:editing.industry,prospect_name:editing.name,channel:editing.channel,status};
   if(editing.contactId)row.contact_id=editing.contactId;
   const {error}=await client.from(editing.contactId?'contact_outreach_statuses':'outreach_statuses').upsert(row,{onConflict:editing.contactId?'industry,prospect_name,contact_id,channel':'industry,prospect_name,channel'});
   if(error)throw new Error('Save failed: '+error.message);
   const key=editing.contactId?contactOutreachKey(editing.industry,editing.name,editing.contactId):outreachKey(editing.industry,editing.name);sharedOverrides[key]={...sharedOverrides[key],[editing.channel]:status};render();
  }};
  async function applySession(next){sessionVersion++;session=next;sharedStore.ready=false;form.hidden=Boolean(session);logout.hidden=!session;
   if(!session){sharedOverrides={};render();say('Sign in to view and update shared statuses.');return;}
   say('Loading shared statuses…');await refresh();
  }
  client.auth.onAuthStateChange((_event,next)=>{setTimeout(()=>applySession(next),0);});
  const initial=await client.auth.getSession();if(initial.error)throw initial.error;await applySession(initial.data.session);
  form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;
   try{const {error}=await client.auth.signInWithOtp({email:form.elements.email.value.trim(),options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});if(error)throw error;say('Check your email for the sign-in link.');}
   catch(error){say('Sign-in failed: '+error.message);}finally{button.disabled=false;}
  });
  logout.addEventListener('click',async()=>{const {error}=await client.auth.signOut();if(error)say(error.message);else await applySession(null);});
  setInterval(()=>{if(!document.hidden)refresh();},15000);
  window.addEventListener('focus',refresh);
 }catch(error){say('Shared connection failed: '+error.message);}
})();
</script>
